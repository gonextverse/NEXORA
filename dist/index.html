    <!-- Mobile optimisation patch v3 -->
    <style>
      /* ════════════════════════════════════════════════
         MOBILE OPTIMISATION v3
         Fixes: sticky-scroll empty space, oversized
         orbit/portal cards, inaccessible menu button
         ════════════════════════════════════════════════ */

      /* ─── Global: overflow + touch targets ─────────── */
      body, #root { max-width: 100vw; overflow-x: hidden; }
      a, button, [role="button"] { min-height: 44px; min-width: 44px; }

      /* ─── Safe-area (notch / home bar) ─────────────── */
      @supports (padding: env(safe-area-inset-bottom)) {
        .footer { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
        .hud    { padding-top: env(safe-area-inset-top); }
      }

      /* ════════════════════════════════════════════════
         ≤ 820 px — tablets + all phones
         ════════════════════════════════════════════════ */
      @media (max-width: 820px) {

        /* KEY FIX: disable sticky scroll intro — it's what
           creates the massive empty space while scrolling.
           Force intro-stage to be a normal block so the
           page flows naturally without parallax gap. */
        .intro-stage {
          position: relative !important;
          height: auto !important;
        }
        .intro-stage > .hero {
          position: relative !important;
          height: 58svh !important;
          min-height: 360px !important;
        }
        .intro.is-still .intro-stage > .hero {
          height: 58svh !important;
        }

        /* Hero standalone (non-intro pages) */
        .hero { min-height: 360px !important; height: 58svh !important; }

        /* Remove spacer blocks that add dead whitespace */
        .spacer { height: 0 !important; display: none !important; }

        /* Section padding — drastically reduced */
        .portals { padding-top: 48px !important; padding-bottom: 40px !important; }
        .page    { padding-top: 72px !important; padding-bottom: 48px !important; min-height: unset !important; }

        /* Orbit: cap size — was taking full screen width */
        .orbit        { max-width: 260px !important; }
        .orbit-layout { gap: 20px !important; }
        .orbit-burst  { width: 90px !important; height: 90px !important; }

        /* Portal cards (first section boxes) */
        .portal-session .portal { min-height: 300px !important; }
        .portal-wall .portal,
        .portal-universe .portal { min-height: 200px !important; }
        .portal-grid { gap: 14px !important; }
        .portal-body { padding: 16px !important; gap: 8px !important; }
        .portal-title { font-size: clamp(18px, 4vw, 26px) !important; }
        .portal-line  { font-size: 14px !important; line-height: 1.5 !important; }

        /* Prevent media overflowing */
        img, canvas, svg { max-width: 100%; }
      }

      /* ════════════════════════════════════════════════
         ≤ 600 px — phones
         ════════════════════════════════════════════════ */
      @media (max-width: 600px) {

        /* Shorter hero */
        .intro-stage > .hero,
        .intro.is-still .intro-stage > .hero,
        .hero { height: 50svh !important; min-height: 300px !important; }

        /* Word banners */
        .word   { font-size: 28px !important; }
        .word-l { left: 14px !important; }
        .word-r { right: 14px !important; }

        /* Hero tag */
        .hero-tag {
          font-size: 10px !important;
          letter-spacing: .06em !important;
          width: calc(100% - 28px) !important;
        }

        /* Scroll hint */
        .scroll-hint {
          bottom: max(80px, calc(env(safe-area-inset-bottom) + 72px)) !important;
        }

        /* HUD — hide coords, shrink text, use full-width tap zone */
        .hud-coords { display: none !important; }
        .hud-brand  { font-size: 11px !important; letter-spacing: .05em; }
        .hud-motion { top: 32px !important; left: 14px !important; font-size: 11px !important; gap: 4px !important; }

        /* ── MENU BUTTON — HUD-native style, bigger tap zone ── */
        .hud-menu {
          top: 32px !important;
          right: 20px !important;
          font-size: 13px !important;
          letter-spacing: .14em !important;
          /* Larger invisible tap area via padding — no visual change */
          padding: 14px 16px !important;
          margin: -14px -16px !important;
          /* Subtle chamfered underline in site's cyan */
          border-bottom: 1px solid rgba(94, 243, 255, 0.4) !important;
          color: var(--ink, #c6d4ea) !important;
          min-height: 44px !important;
          display: inline-flex !important;
          align-items: center !important;
          transition: color .3s !important;
          z-index: 200 !important;
          background: none !important;
          border-radius: 0 !important;
        }
        .hud-menu:hover, .hud-menu:focus {
          color: #5ef3ff !important;
          border-bottom-color: #5ef3ff !important;
          outline: none !important;
        }
        .hud-menu:active {
          color: #fff !important;
          text-shadow: 0 0 10px rgba(94, 243, 255, 0.7) !important;
        }

        /* Orbit */
        .orbit       { max-width: 200px !important; }
        .orbit-burst { width: 70px !important; height: 70px !important; }

        /* Portals */
        .portals { padding-top: 32px !important; padding-bottom: 28px !important; }
        .portal-session .portal { min-height: 240px !important; }
        .portal-wall .portal,
        .portal-universe .portal { min-height: 160px !important; }
        .portal-title { font-size: clamp(16px, 5vw, 22px) !important; }
        .portal-line  { font-size: 13px !important; }
        .portal-cta   { font-size: 12px !important; }

        /* Section titles */
        .section-title {
          font-size: clamp(20px, 6vw, 28px) !important;
          margin-bottom: 18px !important;
        }

        /* Container padding */
        .container { padding-left: 16px !important; padding-right: 16px !important; }

        /* Footer */
        .footer-stage { flex-direction: column !important; gap: 10px !important; }
        .footer-wordmark { font-size: 11px !important; }
      }

      /* ════════════════════════════════════════════════
         ≤ 390 px — iPhone 14 Pro / most Androids
         ════════════════════════════════════════════════ */
      @media (max-width: 390px) {
        .hero,
        .intro-stage > .hero { height: 46svh !important; min-height: 280px !important; }
        .word  { font-size: 22px !important; }
        .orbit { max-width: 160px !important; }
        .portals { padding-top: 24px !important; padding-bottom: 20px !important; }
        .page    { padding-top: 48px !important; }
        .section-title { font-size: clamp(17px, 5.5vw, 22px) !important; }
        .portal-session .portal { min-height: 200px !important; }
        .portal-wall .portal,
        .portal-universe .portal { min-height: 140px !important; }
        .hud-menu { padding: 8px 14px !important; font-size: 11px !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
