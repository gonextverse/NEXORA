    <!-- Mobile optimisation patch v2 -->
    <style>
      /* ═══════════════════════════════════════════════
         MOBILE OPTIMISATION — targets real issues seen
         in screenshot: giant orbit, empty hero space,
         excessive section padding, oversized elements
         ═══════════════════════════════════════════════ */

      /* ─── Touch targets (all sizes) ────────────────── */
      a, button, [role="button"] { min-height: 44px; min-width: 44px; }

      /* ─── Global overflow safety net ───────────────── */
      body, #root { max-width: 100vw; overflow-x: hidden; }

      /* ─── Safe-area insets (notch / home bar) ───────── */
      @supports (padding: env(safe-area-inset-bottom)) {
        .footer { padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
        .hud    { padding-top: env(safe-area-inset-top); }
      }

      /* ════════════════════════════════════════════════
         ≤ 820 px  (tablets and all phones)
         ════════════════════════════════════════════════ */
      @media (max-width: 820px) {

        /* Hero — don't lock to full viewport on mobile */
        .hero { min-height: 420px !important; height: 60svh !important; }

        /* Huge section padding → cut in half */
        .portals { padding-top: clamp(44px,8vh,80px) !important; padding-bottom: clamp(36px,6vh,64px) !important; }
        .page    { padding-top: clamp(64px,10vh,100px) !important; padding-bottom: 56px !important; min-height: unset !important; }

        /* Orbit widget — cap size so it doesn't fill the screen */
        .orbit           { max-width: 280px !important; }
        .orbit-layout    { gap: 24px !important; }
        .orbit-burst     { width: 100px !important; height: 100px !important; }

        /* Spacer — remove excessive gap */
        .spacer { height: 10px !important; }

        /* Prevent images / canvas overflowing */
        img, canvas, svg { max-width: 100%; height: auto; }
      }

      /* ════════════════════════════════════════════════
         ≤ 600 px  (phones landscape + small tablets)
         ════════════════════════════════════════════════ */
      @media (max-width: 600px) {

        /* Hero even shorter — content is sparse */
        .hero { height: 52svh !important; min-height: 340px !important; }

        /* Word banners */
        .word   { font-size: 32px !important; }
        .word-l { left: 16px !important; }
        .word-r { right: 16px !important; }

        /* Orbit capped further */
        .orbit        { max-width: 220px !important; }
        .orbit-core   { top: 36% !important; right: 36% !important; bottom: 36% !important; left: 36% !important; }
        .orbit-burst  { width: 80px !important; height: 80px !important; }

        /* Section & portal spacing */
        .portals  { padding-top: 36px !important; padding-bottom: 32px !important; }
        .page     { padding-top: 56px !important; }
        .portal   { min-height: 220px !important; }
        .portal-cta { font-size: 12px; padding: 10px 18px; }

        /* Section titles */
        .section-title { font-size: clamp(20px, 6vw, 30px) !important; margin-bottom: 20px !important; }

        /* HUD nav */
        .hud-coords { display: none; }
        .hud-brand  { font-size: 11px; }
        .hud-menu   { top: 36px; right: 16px; font-size: 11px; }
        .hud-motion { top: 34px; left: 16px; font-size: 11px; gap: 4px; }

        /* Hero tag */
        .hero-tag { font-size: 10px !important; width: calc(100% - 32px) !important; letter-spacing: .06em !important; }

        /* Scroll hint */
        .scroll-hint { bottom: max(90px, calc(env(safe-area-inset-bottom) + 80px)) !important; }

        /* Container padding */
        .container { padding-left: 16px !important; padding-right: 16px !important; }

        /* Footer */
        .footer-stage { flex-direction: column !important; gap: 12px !important; }
      }

      /* ════════════════════════════════════════════════
         ≤ 390 px  (iPhone 14 Pro / 15 / most Androids)
         ════════════════════════════════════════════════ */
      @media (max-width: 390px) {
        .hero   { height: 48svh !important; min-height: 300px !important; }
        .word   { font-size: 24px !important; }
        .orbit  { max-width: 180px !important; }
        .portals{ padding-top: 28px !important; padding-bottom: 24px !important; }
        .page   { padding-top: 48px !important; }
        .section-title { font-size: clamp(18px, 5.5vw, 24px) !important; }
        .portal { min-height: 180px !important; }
      }
    </style>
