    <!-- Mobile optimisation patch -->
    <style>
      /* ─── Touch target baseline ─────────────────────── */
      a, button, [role="button"] {
        min-height: 44px;
        min-width: 44px;
      }

      /* ─── 480 px and below ──────────────────────────── */
      @media (max-width: 480px) {

        /* HUD nav — bigger tap areas, tighter layout */
        .hud-brand { font-size: 11px; letter-spacing: .06em; }
        .hud-menu  { top: 36px; right: 16px; font-size: 11px; }
        .hud-motion{ top: 34px; left: 16px;  font-size: 11px; gap: 4px; }
        .hud-coords{ display: none; }

        /* Hero word banners */
        .word { font-size: 28px !important; }
        .word-l { left: 12px !important; }
        .word-r { right: 12px !important; }

        /* Hero tag line */
        .hero-tag {
          font-size: 10px !important;
          letter-spacing: .05em !important;
          width: calc(100% - 32px) !important;
        }

        /* Scroll hint */
        .scroll-hint {
          bottom: max(100px, calc(env(safe-area-inset-bottom) + 88px)) !important;
        }
        .scroll-hint-label { font-size: 9px; }

        /* Portals */
        .portal       { min-height: 240px !important; }
        .portal-title { font-size: 15px; }
        .portal-cta   { font-size: 12px; padding: 10px 18px; }
        .portal-window{ width: 80% !important; }

        /* Section titles */
        .section-title { font-size: clamp(22px, 7vw, 32px); }

        /* Footer */
        .footer-stage    { flex-direction: column; gap: 16px; align-items: flex-start; }
        .footer-wordmark { font-size: 11px; }
        .footer-place    { font-size: 10px; }

        /* Warp / intro */
        .warp-text { font-size: clamp(12px, 4vw, 18px); }
        .warp-sub  { font-size: clamp(10px, 3vw, 14px); }
        .warp-label{ font-size: 10px; }

        /* Container padding */
        .container { padding-left: 16px !important; padding-right: 16px !important; }

        /* Prevent horizontal overflow */
        .hero, .portals, .route { overflow-x: hidden; }
      }

      /* ─── 390 px and below (iPhone 14/15 Pro etc.) ──── */
      @media (max-width: 390px) {
        .word { font-size: 22px !important; }
        .section-title { font-size: clamp(18px, 6.5vw, 26px); }
        .portal { min-height: 200px !important; }
        .portal-cta { font-size: 11px; padding: 9px 14px; }
        .hud-brand { font-size: 10px; }
      }

      /* ─── Global overflow safety net ────────────────── */
      @media (max-width: 820px) {
        body, #root { max-width: 100vw; overflow-x: hidden; }
        img, svg, canvas { max-width: 100%; }
      }

      /* ─── Safe-area padding for notch/home-bar phones ─ */
      @supports (padding: env(safe-area-inset-bottom)) {
        .footer {
          padding-bottom: calc(16px + env(safe-area-inset-bottom));
        }
        .hud {
          padding-top: env(safe-area-inset-top);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
